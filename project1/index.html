<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Students by Country</title>
  <link rel="icon" href="data:,">
  <style>
    body {
      font-family: sans-serif;
      max-width: 720px;
      margin: 40px auto;
      padding: 0 20px;
      background: #f5f7fa;
      color: #243042;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
    }

    th, td {
      padding: 12px 16px;
      border-bottom: 1px solid #e5e7eb;
      text-align: left;
    }

    th {
      background: #243042;
      color: white;
    }

    th:last-child, td:last-child {
      text-align: right;
    }
  </style>
</head>
<body>
  <h1>Students by Country</h1>
  <p id="status" role="status">Loading data...</p>

  <table hidden id="student-table">
    <thead>
      <tr>
        <th scope="col">Country</th>
        <th scope="col">Student Count</th>
      </tr>
    </thead>
    <tbody id="student-list"></tbody>
  </table>

  <script>
    // Azure Function endpoint
    const API_URL =
      "https://26studentapi-apbgh2hyane7gwh9.westus3-01.azurewebsites.net/api/httpTrigger2";

    async function loadStudents() {
      const status = document.getElementById("status");
      const list = document.getElementById("student-list");
      const table = document.getElementById("student-table");

      try {
        const response = await fetch(API_URL);

        if (!response.ok) {
          throw new Error(`Request failed: HTTP ${response.status}`);
        }

        const students = await response.json();

        if (!Array.isArray(students)) {
          throw new Error("The response is not an array.");
        }

        // Sort by student count in descending order.
        students.sort((a, b) => b.StudentCount - a.StudentCount);

        let total = 0;

        for (const student of students) {
          const row = document.createElement("tr");
          const country = document.createElement("td");
          const count = document.createElement("td");

          country.textContent = student.Country ?? "Not specified";
          count.textContent = student.StudentCount.toLocaleString("en-US");

          row.append(country, count);
          list.appendChild(row);

          total += student.StudentCount;
        }

        status.textContent =
          `${students.length} countries · ${total.toLocaleString("en-US")} students`;

        table.hidden = false;
      } catch (error) {
        console.error(error);
        status.textContent =
          "Unable to load data. Please check the API URL and connection settings.";
      }
    }

    loadStudents();
  </script>
</body>
</html>
