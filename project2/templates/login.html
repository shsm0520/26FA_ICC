{% extends 'base.html' %}{% block content %}
<h1>Welcome back</h1>
<form method="post">
  <input type="hidden" name="csrf" value="{{csrf_token()}}" /><label
    for="username"
    >Username</label
  ><input
    id="username"
    name="username"
    autocomplete="username"
    required
  /><label for="password">Password</label
  ><input
    id="password"
    name="password"
    type="password"
    autocomplete="current-password"
    maxlength="128"
    required
  /><button>Log in</button>
</form>
{% endblock %}
